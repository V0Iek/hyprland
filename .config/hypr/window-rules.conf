windowrule = match:class Spotify, workspace 5, no_initial_focus on
windowrule = match:class discord, workspace 4, no_initial_focus on
windowrule = match:class steam, float on
windowrule = match:title Steam, tile on
windowrule = match:class ^(steam_app)(.*), fullscreen on
windowrule = match:class org.kde.polkit-kde-authentication-agent-1, float on
windowrule = match:class Rofi, float on
windowrule = match:class org.gnome.FileRoller, float on
windowrule = match:class file-roller, float on
windowrule = match:class PureRef, float on
windowrule = match:class Aseprite, tile on
windowrule = match:class swaync, no_blur off
