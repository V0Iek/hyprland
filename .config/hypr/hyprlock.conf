# ------------------------------------------

# ------------------------------------------
# General
# ------------------------------------------
general {
  hide_cursor = true
}

# ------------------------------------------
# Colorscheme
# ------------------------------------------
source = ~/.config/hypr/colors.conf

# ------------------------------------------
# Background
# ------------------------------------------
background {
  monitor =
  path = /home/michal/.Wallpapers/BMW.png

  blur_passes = 3
  blur_size = 5
}

# ------------------------------------------
# Input field
# ------------------------------------------
input-field {
  monitor = DP-1
  size = 400, 50
  outline_thickness = 0
  inner_color = $base
  font_color = $text
  
  position = 0, -50
  halign = center
  valign = center
}

# ------------------------------------------
# Clock
# ------------------------------------------
label {
  monitor = DP-1
  text = cmd[update: 60000] echo $TIME
  color = $lavender
  font_family = Fira Sans Semibold
  font_size = 200

  position = 0, 100
  halign = center
  valign = center
}

# ------------------------------------------
# Greeting
# ------------------------------------------
label {
  monitor = DP-1
  text = Hi, $USER
  color = $surface2
  font_family = JetBrainsMono Nerd Font
  font_size = 24

  position = 0, 50
  halign = center
}
