# ------------------------------------------

# ------------------------------------------
# General
# ------------------------------------------
general {
  hide_cursor = true
}

# ------------------------------------------
# Colorscheme
# ------------------------------------------
source = ~/.config/hypr/colors.conf

# ------------------------------------------
# Variables
# ------------------------------------------
$monitor = eDP-1
$wallpaper = ~/.config/hypr/wallpaper.png
$font = Google Sans Flex

# ------------------------------------------
# Background
# ------------------------------------------
background {
  path = $wallpaper

  blur_passes = 3
  blur_size = 5
}

# ------------------------------------------
# Input field
# ------------------------------------------
input-field {
  monitor = $monitor
  size = 250, 50
  outline_thickness = 0
  inner_color = $inactive
  font_family = $font medium
  font_color = $text
  fade_on_empty = false
  
  position = 0, 20
  halign = center
  valign = bottom
}

# ------------------------------------------
# Clock
# ------------------------------------------
label {
  monitor = $monitor
  text = cmd[update: 60000] echo $(date +"%H")
  color = $primary
  font_family = $font semibold
  font_size = 300

  position = 0, 320
  halign = center
  valign = center
}

label {
  monitor = $monitor
  text = cmd[update: 60000] echo $(date +"%M")
  color = $text
  font_family = $font semibold
  font_size = 300

  position = 0, 0
  halign = center
  valign = center
}

# ------------------------------------------
# Date
# ------------------------------------------
label {
  monitor = $monitor
  text = cmd[update: 60000] echo $(date +"%A, %B %d")
  color = $text
  font_family = $font medium
  font_size = 25

  position = 50, -50
  halign = left
  valign = top
}

# ------------------------------------------
# Greeting
# ------------------------------------------
label {
  monitor = $monitor
  text = Hi, $USER
  color = $text
  font_family = JetBrainsMono Nerd Font
  font_size = 24

  position = 0, 70
  halign = center
  valign = bottom
}
