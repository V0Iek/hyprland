# -------------------------

$mainMod = SUPER

# -------------------------
# General
# -------------------------
bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exec, ~/.config/rofi/applets/powermenu.sh
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, space, exec, rofi -show drun
bind = $mainMod, P, pseudo
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/reload.sh
bind = $mainMod, B, exec, flatpak run app.zen_browser.zen

bind = $mainMod, J, togglesplit
bind = $mainMod, V, togglefloating
#bing = $mainmod, W, exec, hyprctl keyword general:layout "scrolling" 
#bind = $mainMod, T, exec, ~/.config/hypr/scripts/allfloat.sh 

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, L, exec, hyprlock


# -------------------------
# Apperance
# -------------------------
bind = $mainMod, T, exec, ~/.config/colorschemes/themeswitcher.sh
bind = $mainMod, C, exec, ~/.config/waybar-themes/layoutswitcher.sh
bind = $mainMod, W, exec, ~/.config/scripts/theme-switcher-gui.sh


# -------------------------
# Workspaces
# -------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, page_down, workspace, e+1
bind = $mainMod, page_up, workspace, e-1


# -------------------------
# Windows
# -------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod SHIFT, V, fullscreen, 0
bind = $mainMod ALT, V, fullscreen, 1

binde = $mainMod SHIFT, right,  resizeactive, 10 0
binde = $mainMod SHIFT, left,   resizeactive, -10 0
binde = $mainMod SHIFT, up,     resizeactive, 0 -10
binde = $mainMod SHIFT, down,   resizeactive, 0 10

# -------------------------
# Media
# -------------------------
bindle = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindle = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioStop, exec, playerctl stop
bindl = , XF86AudioNext, exec, playerctl next 
bindl = , XF86AudioPrev, exec, playerctl previous
bind = $mainMod, A, exec, ./.config/rofi/applets/audiooutputswitcher.sh


# -------------------------
# Screenshots
# -------------------------

#bind = , Print, exec, grim -g "$(slurp)" "$(xdg-user-dir PICTURES)/Screenshots/Screenshot from $(date '+%Y-%m-%d %H-%M-%S').png"
bind = , Print, exec, ./.config/rofi/applets/screenshot.sh
bind = $mainMod, M, exec, wl-paste | swappy -f -
