# -------------------------------------------------------------
# Default programs
# -------------------------------------------------------------
$terminal = alacritty --config-file ~/.config/alacritty/hyprland.toml
$fileManager = nemo
$menu = killall rofi || rofi -show drun

# -------------------------------------------------------------
# Some default env vars.
# -------------------------------------------------------------
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, qt5ct
env = GTK_THEME, catppuccin-mocha-lavender-standard+default

# -------------------------------------------------------------
# Colorscheme
# -------------------------------------------------------------
source = ~/.config/hypr/mocha.conf
